<style>
:root{
  --ink:#0A0908;
  --bone:#F0EBE1;
  --gold:#B8935A;
  --gold2:#9A6B2E;
  --muted:rgba(240,235,225,0.45);
  --line:rgba(184,147,90,0.18);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--ink);
  color:var(--bone);
  font-family:'Jost',sans-serif;
  font-weight:300;
  overflow-x:hidden;
}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:32px 72px;
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(to bottom,rgba(10,9,8,0.98),transparent);
}
.nav-name{
  font-family:'Cormorant Garamond',serif;
  font-size:1rem;letter-spacing:0.2em;
  color:var(--gold);font-weight:300;
  text-decoration:none;
}
.nav-links{display:flex;gap:44px;list-style:none;}
.nav-links a{
  font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;transition:color 0.3s;
}
.nav-links a:hover,.nav-links a.active{color:var(--gold);}

/* PAGE HEADER */
.page-header{
  padding:180px 72px 80px;
  border-bottom:1px solid var(--line);
  position:relative;overflow:hidden;
}
.page-header-bg{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 50% at 80% 40%,rgba(184,147,90,0.06) 0%,transparent 65%);
}
.page-header-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(184,147,90,0.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(184,147,90,0.07) 1px,transparent 1px);
  background-size:70px 70px;
  mask-image:radial-gradient(ellipse at center,black 10%,transparent 75%);
}
.page-label{
  font-size:0.55rem;letter-spacing:0.45em;text-transform:uppercase;
  color:var(--gold);margin-bottom:20px;
  display:flex;align-items:center;gap:18px;
  position:relative;z-index:2;
}
.page-label::before{content:'';width:32px;height:1px;background:var(--gold);}
.page-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2.8rem,6vw,5.5rem);
  font-weight:300;line-height:0.95;
  position:relative;z-index:2;
  margin-bottom:40px;
}
.page-title em{font-style:italic;color:var(--gold2);}

/* SEARCH INPUT */
.search-wrap{
  position:relative;z-index:2;
  max-width:620px;
}
.search-input{
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1px solid rgba(184,147,90,0.4);
  outline:none;
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.1rem,2vw,1.5rem);
  font-weight:300;
  color:var(--bone);
  padding:12px 0;
  transition:border-color 0.3s;
}
.search-input::placeholder{
  color:rgba(240,235,225,0.22);
  font-style:italic;
}
.search-input:focus{border-color:var(--gold);}

/* RESULTS AREA */
.search-body{
  padding:0 72px 120px;
}
.results-meta{
  padding:32px 0 0;
  font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;
  color:rgba(240,235,225,0.3);
  min-height:40px;
}
.results-list{
  display:flex;flex-direction:column;
}
.result-item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:40px;align-items:start;
  padding:44px 0;
  border-bottom:1px solid var(--line);
  text-decoration:none;color:inherit;
  transition:padding-left 0.3s;
  position:relative;
}
.result-item::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(to right,var(--gold),transparent);
  transform:scaleX(0);transform-origin:left;
  transition:transform 0.5s;
}
a.result-item:hover::before{transform:scaleX(1);}
a.result-item:hover{padding-left:10px;}
.ri-body{display:flex;flex-direction:column;gap:10px;}
.ri-collection{
  font-size:0.52rem;letter-spacing:0.35em;text-transform:uppercase;
  color:var(--gold);
}
.ri-title{
  font-family:'Cormorant Garamond',serif;
  font-size:1.4rem;font-weight:400;line-height:1.3;
  transition:color 0.3s;
}
a.result-item:hover .ri-title{color:var(--gold2);}
.ri-desc{
  font-size:0.78rem;color:rgba(240,235,225,0.6);
  line-height:1.85;max-width:580px;
}
.ri-tags{
  font-size:0.58rem;color:rgba(240,235,225,0.25);
  letter-spacing:0.08em;line-height:1.6;
}
.ri-action{
  font-size:0.55rem;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--gold);white-space:nowrap;
  display:flex;align-items:center;gap:10px;
  transition:gap 0.3s;
  align-self:center;
}
a.result-item:hover .ri-action{gap:18px;}
.ri-action::after{content:'→';}
.ri-soon{
  font-size:0.55rem;letter-spacing:0.22em;text-transform:uppercase;
  color:rgba(184,147,90,0.3);
  align-self:center;white-space:nowrap;
}
.ri-match{background:rgba(184,147,90,0.12);border-radius:2px;padding:0 2px;}

/* EMPTY / DEFAULT STATE */
.state-block{
  padding:80px 0;
  font-family:'Cormorant Garamond',serif;
  font-size:1rem;font-style:italic;
  color:rgba(240,235,225,0.25);
  line-height:1.7;
}

/* BACK LINK */
.back-link{
  display:inline-flex;align-items:center;gap:12px;
  padding:60px 72px;
  font-size:0.55rem;letter-spacing:0.28em;text-transform:uppercase;
  color:var(--gold);text-decoration:none;transition:gap 0.3s;
}
.back-link:hover{gap:20px;}
.back-link::before{content:'←';}

/* FOOTER */
footer{
  padding:44px 72px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
}
.f-name{font-family:'Cormorant Garamond',serif;font-size:0.9rem;letter-spacing:0.2em;color:var(--gold);font-weight:300;}
.f-copy{font-size:0.58rem;letter-spacing:0.15em;color:rgba(240,235,225,0.2);}

/* RESPONSIVE */
@media(max-width:900px){
  nav{padding:24px 28px;}
  .nav-links{display:none;}
  .page-header{padding:140px 28px 60px;}
  .search-body{padding:0 28px 80px;}
  .result-item{grid-template-columns:1fr;gap:12px;}
  .ri-action,.ri-soon{align-self:flex-start;}
  .back-link{padding:48px 28px;}
  footer{padding:32px 28px;flex-direction:column;gap:12px;text-align:center;}
}

.nav-links a.nav-search{display:inline-flex;align-items:center;padding:1px 0;}
.nav-links a.nav-search svg{width:14px;height:14px;display:block;}

<div class="page-header">
  <div class="page-header-bg"></div>
  <div class="page-header-grid"></div>
  <div class="page-label">Search</div>
  <h1 class="page-title">Find what<br><em>you're looking for</em></h1>
  <div class="search-wrap">
    <input
      class="search-input"
      id="searchInput"
      type="search"
      placeholder="Luxury, identity, wealth, belonging…"
      autocomplete="off"
      spellcheck="false"
      autofocus
    >
  </div>
</div>

<div class="search-body">
  <div class="results-meta" id="resultsMeta"></div>
  <div class="results-list" id="resultsList">
    <div class="state-block" id="defaultState">
      All case studies, essays, frameworks, and fiction — indexed and waiting.
    </div>
  </div>
</div>

<script>
const input = document.getElementById('searchInput');
const resultsList = document.getElementById('resultsList');
const resultsMeta = document.getElementById('resultsMeta');
const defaultState = document.getElementById('defaultState');

let index = [];

fetch('search-index.json')
  .then(r => r.json())
  .then(data => { index = data; })
  .catch(() => {});

function highlight(text, query) {
  if (!query) return escHtml(text);
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escHtml(text).replace(new RegExp(`(${escaped})`, 'gi'), '<mark class="ri-match">$1</mark>');
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function search(query) {
  query = query.trim();

  if (!query) {
    resultsMeta.textContent = '';
    resultsList.innerHTML = '';
    resultsList.appendChild(defaultState);
    defaultState.style.display = '';
    return;
  }

  defaultState.style.display = 'none';
  const q = query.toLowerCase();
  const results = index.filter(item => {
    const haystack = [
      item.title,
      item.collection,
      item.type,
      item.description,
      ...(item.tags || []),
    ].join(' ').toLowerCase();
    return q.split(/\s+/).every(word => haystack.includes(word));
  });

  resultsMeta.textContent = results.length
    ? `${results.length} result${results.length === 1 ? '' : 's'}`
    : '';

  if (!results.length) {
    resultsList.innerHTML = `<div class="state-block">Nothing matching "<em>${escHtml(query)}</em>" — try a different term.</div>`;
    return;
  }

  resultsList.innerHTML = results.map(item => {
    const isLink = item.url && item.status === 'published';
    const tag = item.type;
    const action = item.status === 'in_progress'
      ? `<span class="ri-soon">In Progress</span>`
      : `<span class="ri-action">Open</span>`;

    const inner = `
      <div class="ri-body">
        <span class="ri-collection">${highlight(item.collection, query)} · ${highlight(tag, query)}</span>
        <h2 class="ri-title">${highlight(item.title, query)}</h2>
        <p class="ri-desc">${highlight(item.description, query)}</p>
        <p class="ri-tags">${item.tags.map(t => highlight(t, query)).join(' · ')}</p>
      </div>
      ${action}
    `;

    if (isLink) {
      const target = item.url.endsWith('.pdf') ? ' target="_blank"' : '';
      return `<a href="${item.url}"${target} class="result-item">${inner}</a>`;
    } else {
      return `<div class="result-item">${inner}</div>`;
    }
  }).join('');
}

input.addEventListener('input', () => search(input.value));

// Support ?q= in URL
const params = new URLSearchParams(location.search);
const preQuery = params.get('q');
if (preQuery) {
  input.value = preQuery;
  search(preQuery);
}
</script>

<!-- command palette (⌘K) -->
<div class="cmdk" id="cmdk" aria-hidden="true">
  <div class="cmdk-backdrop" data-cmdk-close></div>
  <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="Search the archive">
    <div class="cmdk-top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="cmdkInput" class="cmdk-input" type="text" placeholder="Search the archive…" autocomplete="off" spellcheck="false" aria-label="Search the archive">
      <kbd class="cmdk-esck">ESC</kbd>
    </div>
    <div class="cmdk-results" id="cmdkResults"></div>
    <div class="cmdk-foot"><span>↑ ↓ &nbsp;navigate</span><span>↵ &nbsp;open</span><span>esc &nbsp;close</span></div>
  </div>
</div>
<style>
.cmdk{position:fixed;inset:0;z-index:10060;display:none;font-family:'Jost',sans-serif;}
.cmdk.open{display:block;}
.cmdk-backdrop{position:absolute;inset:0;background:rgba(6,5,4,0.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);}
.cmdk-panel{position:relative;max-width:620px;margin:11vh auto 0;background:#100c0a;border:1px solid rgba(184,147,90,0.25);box-shadow:0 30px 90px rgba(0,0,0,0.65);overflow:hidden;animation:cmdkin .18s ease;}
@keyframes cmdkin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.cmdk-top{display:flex;align-items:center;gap:14px;padding:19px 22px;border-bottom:1px solid rgba(184,147,90,0.16);}
.cmdk-top svg{width:16px;height:16px;color:#B8935A;flex-shrink:0;}
.cmdk-input{flex:1;background:transparent;border:none;outline:none;color:#F0EBE1;font-family:'Cormorant Garamond',serif;font-size:1.35rem;}
.cmdk-input::placeholder{color:rgba(240,235,225,0.3);}
.cmdk-esck{font-family:'Jost',sans-serif;font-size:0.5rem;letter-spacing:0.2em;color:rgba(240,235,225,0.4);border:1px solid rgba(184,147,90,0.28);padding:3px 6px;border-radius:3px;}
.cmdk-results{max-height:52vh;overflow-y:auto;}
.cmdk-row{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:14px 22px;cursor:pointer;border-bottom:1px solid rgba(184,147,90,0.06);text-decoration:none;color:inherit;}
.cmdk-row:last-child{border-bottom:none;}
.cmdk-row.sel{background:rgba(184,147,90,0.11);}
.cmdk-row .t{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:#F0EBE1;line-height:1.3;}
.cmdk-row .c{font-size:0.5rem;letter-spacing:0.2em;text-transform:uppercase;color:#B8935A;white-space:nowrap;}
.cmdk-row.soon{opacity:0.45;cursor:default;}
.cmdk-empty{padding:30px 22px;font-family:'Cormorant Garamond',serif;font-style:italic;color:rgba(240,235,225,0.3);}
.cmdk-foot{display:flex;gap:24px;padding:12px 22px;border-top:1px solid rgba(184,147,90,0.16);font-size:0.5rem;letter-spacing:0.16em;text-transform:uppercase;color:rgba(240,235,225,0.3);}
@media(max-width:600px){.cmdk-panel{margin:5vh 14px 0;}.cmdk-foot{display:none;}}
</style>
<script>
(function(){
  var el=document.getElementById('cmdk'); if(!el) return;
  var input=document.getElementById('cmdkInput'), results=document.getElementById('cmdkResults');
  var DATA=null, items=[], sel=0, loaded=false;
  function load(cb){ if(loaded){cb&&cb();return;} fetch('search-index.json').then(function(r){return r.json();}).then(function(d){DATA=d;loaded=true;cb&&cb();}).catch(function(){DATA=[];loaded=true;cb&&cb();}); }
  function open(){ el.classList.add('open'); el.setAttribute('aria-hidden','false'); document.documentElement.style.overflow='hidden'; load(function(){filter('');}); setTimeout(function(){input.focus();input.select();},20); }
  function close(){ el.classList.remove('open'); el.setAttribute('aria-hidden','true'); document.documentElement.style.overflow=''; input.value=''; }
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function filter(q){
    q=(q||'').toLowerCase().trim();
    var list=(DATA||[]).filter(function(e){return e.collection!=='Colophon'||q;});
    if(q) list=(DATA||[]).filter(function(e){return (e.title+' '+e.description+' '+(e.tags||[]).join(' ')+' '+e.collection+' '+e.type).toLowerCase().indexOf(q)>-1;});
    list.sort(function(a,b){var as=(!a.url||a.status==='in_progress')?1:0,bs=(!b.url||b.status==='in_progress')?1:0;return as-bs;});
    items=list.slice(0,8); sel=0; draw();
  }
  function draw(){
    if(!items.length){results.innerHTML='<div class="cmdk-empty">Nothing matches that.</div>';return;}
    results.innerHTML=items.map(function(e,i){
      var soon=(!e.url||e.status==='in_progress');
      var tag=soon?'Forthcoming':(e.url.slice(-4)==='.pdf'?'PDF':(e.collection||'').split(' ')[0]);
      var cls='cmdk-row'+(i===sel?' sel':'')+(soon?' soon':'');
      var label='<span class="t">'+esc(e.title)+'</span><span class="c">'+esc(tag)+'</span>';
      if(soon) return '<div class="'+cls+'" data-i="'+i+'">'+label+'</div>';
      return '<a class="'+cls+'" data-i="'+i+'" href="'+e.url+'"'+(e.url.slice(-4)==='.pdf'?' target="_blank" rel="noopener"':'')+'>'+label+'</a>';
    }).join('');
    Array.prototype.forEach.call(results.querySelectorAll('.cmdk-row'),function(r){ r.addEventListener('mousemove',function(){sel=+r.dataset.i;mark();}); });
  }
  function mark(){ Array.prototype.forEach.call(results.children,function(c,i){ if(c.classList) c.classList.toggle('sel',i===sel); }); var s=results.children[sel]; if(s&&s.scrollIntoView) s.scrollIntoView({block:'nearest'}); }
  function go(){ var e=items[sel]; if(!e||!e.url||e.status==='in_progress') return; if(e.url.slice(-4)==='.pdf') window.open(e.url,'_blank'); else window.location.href=e.url; }
  input.addEventListener('input',function(){filter(input.value);});
  input.addEventListener('keydown',function(ev){
    if(ev.key==='ArrowDown'){ev.preventDefault();sel=Math.min(sel+1,items.length-1);mark();}
    else if(ev.key==='ArrowUp'){ev.preventDefault();sel=Math.max(sel-1,0);mark();}
    else if(ev.key==='Enter'){ev.preventDefault();go();}
    else if(ev.key==='Escape'){ev.preventDefault();close();}
  });
  el.addEventListener('click',function(ev){ if(ev.target.hasAttribute('data-cmdk-close')) close(); });
  document.addEventListener('keydown',function(ev){
    if((ev.metaKey||ev.ctrlKey)&&(ev.key==='k'||ev.key==='K')){ev.preventDefault(); el.classList.contains('open')?close():open();}
    else if(ev.key==='Escape'&&el.classList.contains('open')){close();}
  });
  Array.prototype.forEach.call(document.querySelectorAll('a.nav-search'),function(a){ a.addEventListener('click',function(ev){ev.preventDefault();open();}); });
})();
</script>
